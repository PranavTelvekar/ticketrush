databaseChangeLog:
  - changeSet:
      id: create-bookings-table
      author: pranav
      comment: An order made by a user for one event
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bookings
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_user
                    references: users(id)
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bookings_event
                    references: events(id)
              - column:
                  name: total_amount
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-bookings-checks
      author: pranav
      comment: Only known statuses, and the total can't be negative
      changes:
        - sql:
            sql: |
              ALTER TABLE bookings ADD CONSTRAINT chk_bookings_status CHECK (status IN ('PENDING', 'CONFIRMED', 'CANCELLED', 'EXPIRED'));
              ALTER TABLE bookings ADD CONSTRAINT chk_bookings_total_amount CHECK (total_amount >= 0);
      rollback:
        - sql:
            sql: |
              ALTER TABLE bookings DROP CONSTRAINT chk_bookings_total_amount;
              ALTER TABLE bookings DROP CONSTRAINT chk_bookings_status;

  - changeSet:
      id: create-bookings-indexes
      author: pranav
      comment: My bookings (user_id), the expiry job (status + expires_at), bookings per event
      changes:
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_user
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_status_expires
            columns:
              - column:
                  name: status
              - column:
                  name: expires_at
        - createIndex:
            tableName: bookings
            indexName: idx_bookings_event
            columns:
              - column:
                  name: event_id

  - changeSet:
      id: create-booking-seats-table
      author: pranav
      comment: Join table - which event seats belong to which booking
      changes:
        - createTable:
            tableName: booking_seats
            columns:
              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_booking_seats
                    nullable: false
                    foreignKeyName: fk_booking_seats_booking
                    references: bookings(id)
                    deleteCascade: true
              - column:
                  name: event_seat_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_booking_seats
                    nullable: false
                    foreignKeyName: fk_booking_seats_event_seat
                    references: event_seats(id)

  - changeSet:
      id: create-booking-seats-index
      author: pranav
      comment: Find the bookings that contain a given event seat
      changes:
        - createIndex:
            tableName: booking_seats
            indexName: idx_booking_seats_event_seat
            columns:
              - column:
                  name: event_seat_id
