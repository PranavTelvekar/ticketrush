databaseChangeLog:
  - changeSet:
      id: create-payments-table
      author: pranav
      comment: One payment per booking, protected by an idempotency key
      changes:
        - createTable:
            tableName: payments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_payments
                    nullable: false
              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_payments_booking
                    foreignKeyName: fk_payments_booking
                    references: bookings(id)
              - column:
                  name: amount
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: idempotency_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_payments_idempotency_key
              - column:
                  name: transaction_ref
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-payments-checks
      author: pranav
      comment: Only known statuses (PROCESSING = key claimed, payment in progress), amount can't be negative
      changes:
        - sql:
            sql: |
              ALTER TABLE payments ADD CONSTRAINT chk_payments_status CHECK (status IN ('PROCESSING', 'SUCCESS', 'FAILED'));
              ALTER TABLE payments ADD CONSTRAINT chk_payments_amount CHECK (amount >= 0);
      rollback:
        - sql:
            sql: |
              ALTER TABLE payments DROP CONSTRAINT chk_payments_amount;
              ALTER TABLE payments DROP CONSTRAINT chk_payments_status;
