spring:
  application:
    name: TicketRush

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${DB_USERNAME:ticketrush}
    password: ${DB_PASSWORD:ticketrush}

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # ── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoint:
    health:
      show-details: always   # development only: show db/redis status in /actuator/health

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
