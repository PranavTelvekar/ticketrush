spring:
  application:
    name: TicketRush
  
  # Read local secrets (JWT_SECRET, ...) from the git-ignored .env file, if it exists
  config:
    import: optional:file:.env[.properties]

  # ── PostgreSQL ──────────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketrush}
    username: ${DB_USERNAME:ticketrush}
    password: ${DB_PASSWORD:ticketrush}

  # ── JPA / Hibernate ─────────────────────────────────────────
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  # ── Redis ───────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# ── Actuator ──────────────────────────────────────────────────
management:
  endpoint:
    health:
      show-details: always   # development only: show db/redis status in /actuator/health

# ── API docs (Swagger UI) ─────────────────────────────────────
springdoc:
  default-produces-media-type: application/json   # our API always answers with JSON
  swagger-ui:
    path: /swagger-ui.html          # short address; redirects to /swagger-ui/index.html
    tags-sorter: alpha              # groups (tags) in A→Z order
    operations-sorter: method       # inside a group: GET, POST, PUT, PATCH, DELETE
    display-request-duration: true  # show how long each "Try it out" call took
    persist-authorization: true     # remember the JWT you paste, even after a page refresh

# ── TicketRush settings ───────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:}  # Base64 key of at least 32 bytes; comes from .env or an environment variable
    expiration: 1h          # how long a login token is valid

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
