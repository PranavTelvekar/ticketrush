databaseChangeLog:
  - changeSet:
      id: create-events-table
      author: pranav
      comment: Shows that happen at a venue (e.g. a concert)
      changes:
        - createTable:
            tableName: events
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_events
                    nullable: false
              - column:
                  name: venue_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_events_venue
                    references: venues(id)
              - column:
                  name: title
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: category
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: end_time
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: DRAFT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

  - changeSet:
      id: add-events-checks
      author: pranav
      comment: Valid time range, status and category
      changes:
        - sql:
            sql: |
              ALTER TABLE events ADD CONSTRAINT chk_events_time CHECK (end_time > start_time);
              ALTER TABLE events ADD CONSTRAINT chk_events_status CHECK (status IN ('DRAFT', 'PUBLISHED', 'CANCELLED'));
              ALTER TABLE events ADD CONSTRAINT chk_events_category CHECK (category IN ('MUSIC', 'COMEDY', 'SPORTS', 'TECH', 'OTHER'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE events DROP CONSTRAINT chk_events_category;
              ALTER TABLE events DROP CONSTRAINT chk_events_status;
              ALTER TABLE events DROP CONSTRAINT chk_events_time;

  - changeSet:
      id: create-events-indexes
      author: pranav
      comment: Public listing filters by status + start time, by category, and by venue
      changes:
        - createIndex:
            tableName: events
            indexName: idx_events_status_start_time
            columns:
              - column:
                  name: status
              - column:
                  name: start_time
        - createIndex:
            tableName: events
            indexName: idx_events_category
            columns:
              - column:
                  name: category
        - createIndex:
            tableName: events
            indexName: idx_events_venue
            columns:
              - column:
                  name: venue_id

  - changeSet:
      id: create-event-seats-table
      author: pranav
      comment: One chair for one event - price, status and version (for optimistic locking)
      changes:
        - createTable:
            tableName: event_seats
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_event_seats
                    nullable: false
              - column:
                  name: event_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_seats_event
                    references: events(id)
                    deleteCascade: true
              - column:
                  name: seat_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_event_seats_seat
                    references: seats(id)
              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: AVAILABLE
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: add-event-seats-unique
      author: pranav
      comment: A chair can appear only once per event - no duplicate tickets
      changes:
        - addUniqueConstraint:
            tableName: event_seats
            constraintName: uq_event_seats_event_seat
            columnNames: event_id, seat_id

  - changeSet:
      id: add-event-seats-checks
      author: pranav
      comment: Price can't be negative, and only known statuses
      changes:
        - sql:
            sql: |
              ALTER TABLE event_seats ADD CONSTRAINT chk_event_seats_price CHECK (price >= 0);
              ALTER TABLE event_seats ADD CONSTRAINT chk_event_seats_status CHECK (status IN ('AVAILABLE', 'HELD', 'BOOKED'));
      rollback:
        - sql:
            sql: |
              ALTER TABLE event_seats DROP CONSTRAINT chk_event_seats_status;
              ALTER TABLE event_seats DROP CONSTRAINT chk_event_seats_price;

  - changeSet:
      id: create-event-seats-indexes
      author: pranav
      comment: Seat map / availability counts per event, and lookups by physical seat
      changes:
        - createIndex:
            tableName: event_seats
            indexName: idx_event_seats_event_status
            columns:
              - column:
                  name: event_id
              - column:
                  name: status
        - createIndex:
            tableName: event_seats
            indexName: idx_event_seats_seat
            columns:
              - column:
                  name: seat_id
